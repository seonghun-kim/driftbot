<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Driftbot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #game-canvas {
        display: block;
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      #hud {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        font-family: 'Courier New', monospace;
        color: #fff;
      }
      #hud .hud-top {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top));
      }
      #hud .hud-top-left,
      #hud .hud-top-right {
        font-size: 14px;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
      }
      #hud-pause {
        pointer-events: auto;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
        font-size: 18px;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        cursor: pointer;
        margin-left: 8px;
        vertical-align: middle;
        line-height: 44px;
        text-align: center;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      #hud-pause:active {
        background: rgba(255,255,255,0.25);
      }
      #hud .hud-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      #hud .hud-center .message {
        font-size: 32px;
        font-weight: bold;
        text-shadow: 0 0 12px rgba(255,255,255,0.5);
        display: none;
      }
      #scene-overlay {
        position: absolute;
        top: 0; left: 0;
        background: #0a0a12;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        font-family: 'Courier New', monospace;
        color: #fff;
      }
      #scene-overlay .title {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 40px;
        text-shadow: 0 0 20px rgba(100,200,255,0.6);
      }
      #scene-overlay .subtitle {
        font-size: 16px;
        margin-bottom: 32px;
        opacity: 0.7;
      }
      #scene-overlay button {
        pointer-events: auto;
        background: transparent;
        border: 2px solid rgba(255,255,255,0.6);
        color: #fff;
        font-family: 'Courier New', monospace;
        font-size: 18px;
        padding: 12px 40px;
        margin: 8px;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.2s, border-color 0.2s;
      }
      #scene-overlay button:hover,
      #scene-overlay button:active {
        background: rgba(255,255,255,0.15);
        border-color: #fff;
      }
      #scene-overlay .result-status {
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 24px;
      }
      #scene-overlay .result-status.success {
        color: #4f4;
        text-shadow: 0 0 20px rgba(68,255,68,0.5);
      }
      #scene-overlay .result-status.fail {
        color: #f44;
        text-shadow: 0 0 20px rgba(255,68,68,0.5);
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-top-left">
          <span id="hud-items"></span>
          <br><span id="hud-corridor"></span>
        </div>
        <div class="hud-top-right">
          <span id="hud-debug"></span>
          <button id="hud-pause">⏸</button>
        </div>
      </div>
      <div class="hud-center">
        <div id="hud-message" class="message"></div>
      </div>
    </div>
    <div id="scene-overlay"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
